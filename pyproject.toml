[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beamfem"
version = "1.0.0rc1"
description = "梁・トラス・シェルFEM解析と離散・量子ハイブリッド構造最適化"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]
qaoa = [
    "qiskit>=2.1,<3",
    "qiskit-optimization>=0.7,<0.8",
]
qaoa-aer = [
    "qiskit>=2.1,<3",
    "qiskit-optimization>=0.7,<0.8",
    "qiskit-aer>=0.17,<0.18",
]

[project.scripts]
beamfem-optimize = "beamfem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
