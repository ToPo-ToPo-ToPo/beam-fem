name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[viz,dev]"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest
      - name: Common optimizer CLI smoke test
        if: matrix.python-version == '3.12'
        run: |
          python benchmarks/quantum_truss/generate_cases.py small /tmp/beamfem-small.json
          beamfem-optimize /tmp/beamfem-small.json --output /tmp/beamfem-result.json --backend sa --max-iterations 1 --candidates 4 --sa-sweeps 40 --sa-restarts 2

  quantum-smoke:
    name: Quantum backend smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quantum support
        run: python -m pip install -e ".[viz,qaoa-aer]"
      - name: Compile experiment
        run: python -m py_compile experiments/quantum_truss_qaoa/hybrid_qubo_truss_compare.py
      - name: SA smoke test
        env:
          MPLBACKEND: Agg
        run: >-
          python experiments/quantum_truss_qaoa/hybrid_qubo_truss_compare.py
          --solver sa --sa-reads 4 --sa-sweeps 100
      - name: QAOA statevector smoke test
        env:
          MPLBACKEND: Agg
        run: >-
          python experiments/quantum_truss_qaoa/hybrid_qubo_truss_compare.py
          --solver qaoa --qaoa-maxiter 5 --shots 128
      - name: Common QAOA backend smoke test
        run: |
          python benchmarks/quantum_truss/generate_cases.py small /tmp/beamfem-small.json
          beamfem-optimize /tmp/beamfem-small.json --output /tmp/beamfem-qaoa.json --backend qaoa --max-iterations 1 --candidates 3 --qaoa-maxiter 10 --shots 128 --fallback none
      - name: Noisy Aer evidence smoke test
        run: python validation/run_quantum_smoke.py --output /tmp/quantum-evidence.json --shots 128 --maxiter 6

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Complete non-quantum test suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest

  dependency-security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked release environment and auditor
        run: python -m pip install -r requirements-release.lock pip-audit
      - name: Audit installed dependency set
        run: python -m pip_audit --strict --desc

  external-solver-validation:
    name: OpenSees external solver cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install external validation support
        run: python -m pip install -e ".[external-validation]"
      - name: Compare linear and bilinear trusses with OpenSeesPy
        run: python validation/run_opensees_crosscheck.py --output /tmp/opensees-crosscheck.json

  release-evidence:
    name: Release evidence and bounded endurance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release-candidate test environment
        run: python -m pip install -e ".[viz,dev,qaoa-aer]"
      - name: Regenerate deterministic code-check reference
        run: python validation/run_code_check_reference.py --output /tmp/code-check-reference.json
      - name: Run bounded large-case endurance evidence
        run: >-
          python -m benchmarks.endurance_acceptance --seconds 30 --evaluations 100
          --memory-limit-mb 1024 --output /tmp/endurance-evidence.json
      - name: Verify committed automated release evidence remains an RC only
        run: |
          python validation/run_release_gate.py --output /tmp/release-gate.json
          python -c "import json; d=json.load(open('/tmp/release-gate.json')); assert d['automated_release_candidate_passed']; assert not d['external_approvals_passed']; assert d['release_stage']=='release-candidate'"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            /tmp/code-check-reference.json
            /tmp/endurance-evidence.json
            /tmp/release-gate.json
